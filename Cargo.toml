[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
iris-core = { path = "crates/iris-core" }
libraw-sys = { path = "crates/libraw-sys" }
iris-raw = { path = "crates/iris-raw" }
iris-render = { path = "crates/iris-render" }
iris-persist = { path = "crates/iris-persist" }
iris-export = { path = "crates/iris-export" }
rayon = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
